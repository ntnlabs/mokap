name: Android CI

# Push / PR: len kontroly (gitleaks, lint, unit testy) – žiadne APK.
# APK sa vyrába iba na požiadanie: Actions → Android CI → Run workflow,
# alebo push tagu apk-* (napr. apk-2026-10-17) – tak sa dá buildnúť aj z inej vetvy než main.
on:
  push:
    branches: ["**"]
    tags: ["apk-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.28.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
      - name: Scan full git history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .

  checks:
    name: Lint a unit testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint and unit tests
        run: ./gradlew lintDebug testDebugUnitTest
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7

  apk:
    name: Build APK (len na požiadanie)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/apk-')
    needs: [secrets-scan, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug and release
        run: ./gradlew assembleDebug assembleRelease
      - name: Permission audit
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)aapt2"
          echo "== Oprávnenia vo výslednom APK =="
          "$AAPT2" dump permissions "$APK"
          echo "== Odkiaľ prišli (manifest merger) =="
          REPORT=$(find app/build -name 'manifest-merger-release-report.txt' | head -n1)
          if [ -n "$REPORT" ]; then grep -A2 -E '^uses-permission' "$REPORT"; else echo "report nenájdený"; fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: mokap-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7
