name: Android CI

# Push / PR: len kontroly (gitleaks, lint, unit testy) – žiadne APK.
# APK a AAB sa vyrábajú iba na požiadanie: Actions → Android CI → Run workflow,
# alebo push tagu apk-* (napr. apk-2026-10-17) – tak sa dá buildnúť aj z inej vetvy než main.
# Podpísaný release (AAB pre Google Play) len keď sú v repe secrets MOKAP_KEYSTORE_BASE64,
# MOKAP_KEYSTORE_PASSWORD, MOKAP_KEY_ALIAS, MOKAP_KEY_PASSWORD (upload key, nikdy nie v gite).
on:
  push:
    branches: ["**"]
    tags: ["apk-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.28.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
      - name: Scan full git history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .

  checks:
    name: Lint a unit testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Wrapper jar sa spúšťa ako prvý kód buildu – musí sedieť s oficiálnym checksumom od Gradle.
      - name: Overenie gradle-wrapper.jar
        run: |
          version=$(sed -n 's/^distributionUrl=.*gradle-\([0-9.]*\)-\(bin\|all\)\.zip$/\1/p' gradle/wrapper/gradle-wrapper.properties)
          expected=$(curl -fsSL "https://services.gradle.org/distributions/gradle-${version}-wrapper.jar.sha256")
          echo "Gradle ${version}, očakávaný sha256 ${expected}"
          echo "${expected}  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      # Cache cez setup-java (open source actions/cache) namiesto gradle/actions – od v6 má proprietárne cachovanie.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Lint and unit tests
        run: ./gradlew lintDebug testDebugUnitTest
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7

  apk:
    name: Build APK a AAB (len na požiadanie)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/apk-')
    needs: [secrets-scan, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # Upload keystore len do dočasného adresára runnera; bez secrets ostane release nepodpísaný.
      - name: Upload keystore zo secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.MOKAP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "MOKAP_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::Bez secretu MOKAP_KEYSTORE_BASE64 – release APK/AAB nebude podpísaný a AAB sa nenahrá."
          fi
      # Bez NDK AGP natívne knižnice neoreže a symboly pre Play (native debug symbols) do AAB nedá.
      - name: NDK z runnera
        run: |
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          [ -f "$NDK/source.properties" ] || NDK=$(ls -d "$ANDROID_HOME"/ndk/*/ 2>/dev/null | sort -V | tail -n1)
          if [ -z "$NDK" ] || [ ! -f "$NDK/source.properties" ]; then echo "::error::Runner nemá NDK"; exit 1; fi
          ls "$ANDROID_HOME/ndk" || true
          VERSION=$(sed -n 's/^Pkg\.Revision *= *//p' "$NDK/source.properties" | tr -d '[:space:]')
          echo "NDK $VERSION: ${NDK%/}"
          echo "MOKAP_NDK_PATH=${NDK%/}" >> "$GITHUB_ENV"
          echo "MOKAP_NDK_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build debug and release
        # Tretia časť verzie (0.7.0112) = číslo behu tohto workflowu.
        env:
          MOKAP_BUILD_NUMBER: ${{ github.run_number }}
          MOKAP_KEYSTORE_PASSWORD: ${{ secrets.MOKAP_KEYSTORE_PASSWORD }}
          MOKAP_KEY_ALIAS: ${{ secrets.MOKAP_KEY_ALIAS }}
          MOKAP_KEY_PASSWORD: ${{ secrets.MOKAP_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease bundleRelease
      - name: Zmazať keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - name: Permission audit
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)aapt2"
          echo "== Oprávnenia vo výslednom APK =="
          "$AAPT2" dump permissions "$APK"
          echo "== Odkiaľ prišli (manifest merger) =="
          REPORT=$(find app/build -name 'manifest-merger-release-report.txt' | head -n1)
          if [ -n "$REPORT" ]; then grep -A2 -E '^uses-permission' "$REPORT"; else echo "report nenájdený"; fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: mokap-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      # Bez symbolov Play hlási „contains native code, and you've not uploaded debug symbols“. Jediný native
      # kód je z AndroidX a Google ho dodáva už orezaný – AGP nemá z čoho symboly vyrobiť. Preto len výpis
      # (koľko .symtab/.debug_* sekcií knižnice majú), build sa nezastaví.
      - name: Native symboly v AAB
        run: |
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -n1)
          if unzip -l "$AAB" | grep 'BUNDLE-METADATA/com.android.tools.build.debugsymbols/'; then exit 0; fi
          READELF="${MOKAP_NDK_PATH:-}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          if [ -x "$READELF" ]; then
            find app/build/intermediates/merged_native_libs/release -name '*.so' | sort | while read -r SO; do
              echo "$(basename "$(dirname "$SO")")/$(basename "$SO"): $("$READELF" -S "$SO" | grep -cE '\.symtab|\.debug_') sekcií .symtab/.debug_*"
            done
          fi
          echo "::notice::AAB bez native symbolov – knižnice prišli už orezané (AndroidX); varovanie v Play je neškodné."
      # Nepodpísaný AAB Play odmietne – nahrá sa len overený; odtlačok sedí s „Upload key“ v Play Console.
      - name: Overiť podpis AAB
        if: env.MOKAP_KEYSTORE_FILE != ''
        run: |
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -n1)
          jarsigner -verify "$AAB" | tee "$RUNNER_TEMP/verify.txt"
          grep -q "jar verified" "$RUNNER_TEMP/verify.txt"
          keytool -printcert -jarfile "$AAB" | grep -E "SHA256:"
      - name: Upload release AAB (Google Play)
        if: env.MOKAP_KEYSTORE_FILE != ''
        uses: actions/upload-artifact@v7
        with:
          name: mokap-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7
